name: Pull Request

on:
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  android-pr:
    permissions:
      contents: read
    strategy:
      fail-fast: false
    uses: ./.github/workflows/android-reusable-workflow.yaml
    with:
      is_pr: true

  ios-pr:
    permissions:
      contents: read
    strategy:
      fail-fast: false
    uses: ./.github/workflows/ios-reusable-workflow.yaml
    with:
      is_pr: true