on:
  workflow_call:
    inputs:
      is_pr:
        type: boolean
        default: false
      macos:
        default: macos-15
        required: false
        type: string

permissions:
  contents: read

jobs:
  forceios:
    runs-on: ${{ inputs.macos }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ ! inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - name: Install Dependencies
        run: npm install
      - name: Build all ios native templates
        id: build
        run: |
          mkdir -p build_logs
          set -o pipefail
          ./test/test_force.js --exit-on-failure --cli=forceios 2>&1 | tee "build_logs/forceios.log"
      - name: Archive build logs on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: package-build-logs-${{ github.job }}
          path: build_logs/
          if-no-files-found: ignore
          retention-days: 14

  forceios-sfdx:
    runs-on: ${{ inputs.macos }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ ! inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - name: Install Dependencies
        run: npm install
      - name: Install SFDX
        run: npm install -g @salesforce/cli
      - name: Build all ios native templates with SFDX
